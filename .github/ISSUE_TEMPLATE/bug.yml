name: Bug
description: Algo no funciona como en el portal real o como dice la historia
labels: [bug]
body:
  - type: textarea
    id: pasos
    attributes: { label: Pasos para reproducir }
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes: { label: Comportamiento esperado (y referencia al portal real si aplica) }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Comportamiento actual (capturas, consola) }
  - type: dropdown
    id: severidad
    attributes: { label: Severidad, options: [bloqueante, alta, media, baja] }
