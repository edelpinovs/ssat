name: CI
on:
  pull_request:
    paths: ['apps/**', 'packages/**', 'pnpm-lock.yaml', 'package.json', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', 'pnpm-lock.yaml', 'package.json', '.github/workflows/ci.yml']
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ssat, POSTGRES_PASSWORD: ssat, POSTGRES_DB: ssat }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env: { DATABASE_URL: postgresql://ssat:ssat@localhost:5432/ssat }
      - run: pnpm build
  e2e:
    runs-on: ubuntu-latest
    needs: verificar
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }
