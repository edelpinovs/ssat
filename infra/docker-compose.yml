services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: ssat, POSTGRES_PASSWORD: ssat, POSTGRES_DB: ssat }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ../apps/api
    env_file: ../.env
    depends_on: [postgres, redis]
    ports: ["3000:3000"]
  web:
    build: ../apps/web
    env_file: ../.env
    ports: ["5173:80"]
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile, caddy_data:/data]
    depends_on: [web, api]
volumes: { pgdata: {}, caddy_data: {} }
